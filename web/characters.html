<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oathsworn 角色行動卡圖鑑</title>
  <style>
    :root {
      --bg: #12100e;
      --panel: #1c1814;
      --panel-2: #241f1a;
      --border: #3d3326;
      --gold: #c9a255;
      --gold-dim: #8c703b;
      --text: #e6dcc8;
      --muted: #a69880;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    header {
      background: linear-gradient(180deg, #1f1a14 0%, #14110e 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .back-link {
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .back-link:hover { background: rgba(201, 162, 85, 0.12); }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 24px;
      background: #171410;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--gold-dim); }
    .tab-btn.active {
      background: rgba(201, 162, 85, 0.18);
      color: var(--gold);
      border-color: var(--gold);
      font-weight: bold;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .class-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .class-header h2 {
      margin: 0 0 6px 0;
      color: var(--gold);
      font-size: 1.7rem;
    }
    .class-header .en-sub {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-box h3 {
      margin: 0 0 8px 0;
      color: var(--gold);
      font-size: 1.05rem;
      border-bottom: 1px solid rgba(61, 51, 38, 0.6);
      padding-bottom: 6px;
    }
    .en-note {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }
    .levels-list {
      display: grid;
      gap: 12px;
      margin-bottom: 28px;
    }
    .level-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .level-row strong { color: var(--gold); }
    .gallery-title {
      color: var(--gold);
      font-size: 1.2rem;
      margin: 24px 0 12px 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .gallery-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .gallery-item:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 8px;
      border: 1px solid var(--gold-dim);
    }
  </style>
</head>

            "<b>0 費基礎牌</b>：每個職業都有這張必帶的 0 冷卻牌，具有多重重要功能。最基本的是讓玩家每回合都能進行一次高性價比攻擊；更常見的用法是在遭遇戰階段前影響戰鬥流轉並把牌拿回手牌。「重置力量牌庫（Refresh might decks）」能力則讓你在好牌都被抽光、牌庫對你不利時重置牌庫以提高勝算。<br><br><b>1 費（激怒抓撓 Rile and Rake ／ 獵手呼喚 Hunter's Call）</b>：作為起手，女獵手有兩張無論用弓或近戰都能發揮的能力。「激怒抓撓」是紮實的流血與干擾技，能為後續更強的能力鋪路；「獵手呼喚」則是高靈氣效率的攻擊與移動增益，幫助你和隊友迅速拉近與敵人的距離。<br><i>註：你會注意到許多卡牌都有「將巨鷹派往新目標」的副效果，主要用於無法從其他能力獲得免費移動時調整巨鷹位置。</i><br><br><b>2 費（俯衝 Swoop ／ 緊攫 Clamp On）</b>：來到 2 費，我們開始見識巨鷹的更多用途。「俯衝」以極低靈氣消耗提供必中的遠程攻擊（因為出手的是巨鷹而非你本人）。當你走近戰路線時這招特別好用，額外的遠程攻擊讓你無視自身武器射程精準鎖定任何目標。巨鷹直接攻擊的卡牌都有一個共通點：力量上限有限但絕不會失手（牠們的眼力比你好得多），這在牌庫對你不利但你只需要補一點傷害時非常實用。此外，「緊攫」是泛用的移動增益或擊退技，能依需求拉近距離或製造空間，而擊退碰撞造成的扣血更是遊戲中最強大的機制之一。<br><br><b>3 費（阻撓 Hinder ／ 飛羽齊襲 Flight of Feathers）</b>：3 費時女獵手獲得極為強大的「阻撓」，讓你的巨鷹直接撲向敵人臉部救下隊友一命；而「飛羽齊襲」則不留情面，讓巨鷹直撲咽喉並由你緊隨其後，對目標造成必中傷害，在面對分散的敵群時尤其有價值。"
          ],
          [
            "Lv 2 解鎖",
            "升到 2 級後，你會發現女獵手解鎖的能力牌比其他職業更多。為了同時支援遠程與近戰構築，我們為她準備了 20 張（而非 15 張）能力牌。2 級解鎖的是<b>「跳劈（Leap Attack）」</b>、<b>「哨箭（Whistling Arrow）」</b>與<b>「尖刺陷阱（Spike Trap）」</b>。「跳劈」與「哨箭」都能讓女獵手免費召回巨鷹，開啟馴鷹術核心的「派出與召回」循環。「尖刺陷阱」則展現了這位貴族女子的工藝巧思——傷害取決於踩中者的移動距離，如果你能透過擊破生命骰觸發反應、引誘怪物踩過陷阱，傷害將會非常驚人。"
          ],
          [
            "Lv 5 解鎖",
            "5 級賦予女獵手四張新能力：<b>「側翼突襲（Flank Attack）」</b>只要衝鋒起手位置正確就能打出巨額傷害；<b>「鷹眼射擊（Eagle Eye Shot）」</b>提供超遠程攻擊並同時召回一隻巨鷹；<b>「羽翼庇護（Under the Wing）」</b>為女獵手增添另一項防禦增益，與「阻撓」不同的是它不需要目標身上原本就有巨鷹就能使用，還附帶兩個強力替代效果，緊急時非常適合用來流轉其他卡牌；<b>「琥珀炸藥包（Amber Satchel Charge）」</b>則是貴族科技的巔峰——與滑頭的「琥珀炸彈」類似，必須先放置、之後再點燃（總共需打出兩次），讓你體驗投出炸藥包再一箭射爆它的震撼快感，但記得提醒隊友先找掩護！"
          ],
          [
            "Lv 10 解鎖",
            "10 級解鎖兩張弓與刃的專屬技，以及巨鷹能力<b>「啄眼（Eye Gouge）」</b>。<b>「突刺（Lunge）」</b>是近戰女獵手的雙重攻擊，擅長刺穿大型目標；<b>「穿透箭（Piercing Arrow）」</b>則是弓箭版，能把敵人串成一線同時擊殺多個目標。<b>「啄眼」</b>看似不起眼，-1 防禦似乎不多，但考量到遊戲中傷害是除以防禦計算，0 靈氣就能帶來巨大提升（例如 10 傷打 4 防原本掉 2 血，降成 3 防後變成掉 3 血——0 靈氣換來 50% 傷害提升外加一次戰鬥流轉！），在疊滿增益的關鍵大招前使用更是神技。"
          ],
          [
            "Lv 15 解鎖",
            "終於來到 15 級的三張 3 費重砲：<b>「獵鷹連擊（Falcon Strike）」</b>是強大的連鎖攻擊，時機對了最多可一口氣放倒 6 名敵人；<b>「雙重打擊（Tandem Strike）」</b>附帶 2 次重抽與召回，將箭術推向極限（2 次重抽可讓你從抽 5 張推到抽 10 張，最適合疊滿強化後打高血量目標）；最後是<b>「死亡俯衝（Death Dive）」</b>，讓雙鷹同時撲向單一目標，利爪齊出合擊成 8 張牌且絕不會失手的攻擊，讓敵人最後看到的畫面是頭頂遮蔽陽光的雙子彗星。"
          ]
        ]
      }
    ];

    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    function render(id) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
      const c = CLASSES.find(x => x.id === id) || CLASSES[0];
      const imgs = (window.CHARACTER_IMAGES && window.CHARACTER_IMAGES[c.id]) || [];
      let headerImgs = imgs, levelBuckets = [];
      if (c.levels.length === 5) {
        if (c.id === "03_Witch") {
          headerImgs = imgs.slice(0, imgs.length - 13);
          const rest = imgs.slice(imgs.length - 13);
          levelBuckets = [rest.slice(0, 6), rest.slice(6, 8), rest.slice(8, 9), rest.slice(9, 11), rest.slice(11, 13)];
        } else if (c.id === "12_Huntress") {
          headerImgs = imgs.slice(0, 4);
          const rest = imgs.slice(4);
          levelBuckets = [rest.slice(0, 4), rest.slice(4, 6), rest.slice(6, 8), rest.slice(8, 10), rest.slice(10, 12)];
        } else {
          const lv1End = Math.max(0, imgs.length - 4);
          const lv1Start = Math.max(0, lv1End - 4);
          headerImgs = imgs.slice(0, lv1Start);
          levelBuckets = [
            imgs.slice(lv1Start, lv1End),
            imgs.slice(lv1End, lv1End + 1),
            imgs.slice(lv1End + 1, lv1End + 2),
            imgs.slice(lv1End + 2, lv1End + 3),
            imgs.slice(lv1End + 3, lv1End + 4)
          ];
        }
      }

      contentEl.innerHTML = `
        <div class="class-header">
          <h2>${c.name}</h2>
          <div class="en-sub">${c.en}</div>
        </div>
        ${headerImgs.length ? `
          <div class="gallery" style="margin-bottom:20px;">
            ${headerImgs.map(src => `
              <div class="gallery-item" onclick="openLightbox('${src}')">
                <img src="${src}" loading="lazy" alt="${c.name}" />
              </div>
            `).join("")}
          </div>
        ` : ""}
        <div class="info-grid">
          <div class="card-box">
            <h3>特殊能力 (Special Abilities)</h3>
            <div>${c.special.replace(/\n/g, "<br>")}</div>
          </div>
          <div class="card-box">
            <h3>可裝備與定位 (Equipment &amp; Role)</h3>
            <div><strong>裝備：</strong>${c.equip}</div>
            <div style="margin-top:8px;">${c.bg}</div>
          </div>
        </div>
        ${(window.CHARACTER_LORE && window.CHARACTER_LORE[c.id]) ? `
          <details style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:24px;">
            <summary style="cursor:pointer;color:var(--gold);font-weight:bold;user-select:none;">📖 展開完整背景故事與玩法詳解 (Background &amp; Lore)</summary>
            <div style="margin-top:12px;white-space:pre-line;color:var(--text);font-size:0.96rem;line-height:1.75;">${window.CHARACTER_LORE[c.id]}</div>
          </details>
        ` : ""}
        ${c.levels.length ? `
          <div class="levels-list">
            ${c.levels.map(([lv, desc], i) => {
              const slice = levelBuckets[i] || [];
              return `
                <div class="level-row">
                  <div style="margin-bottom:${slice.length ? "12px" : "0"};"><strong>${lv}：</strong>${desc}</div>
                  ${slice.length ? `
                    <div class="gallery">
                      ${slice.map(src => `
                        <div class="gallery-item" onclick="openLightbox('${src}')">
                          <img src="${src}" loading="lazy" alt="${lv}" />
                        </div>
                      `).join("")}
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>
        ` : ""}
      `;
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("open");
    }

    CLASSES.forEach((c, idx) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (idx === 1 ? " active" : "");
      btn.dataset.id = c.id;
      btn.textContent = c.name;
      btn.onclick = () => render(c.id);
      tabsEl.appendChild(btn);
    });

    render("01_Warden");
  </script>
</body>
</html>
