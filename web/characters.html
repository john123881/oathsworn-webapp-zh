<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oathsworn 角色行動卡圖鑑</title>
  <style>
    :root {
      --bg: #12100e;
      --panel: #1c1814;
      --panel-2: #241f1a;
      --border: #3d3326;
      --gold: #c9a255;
      --gold-dim: #8c703b;
      --text: #e6dcc8;
      --muted: #a69880;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    header {
      background: linear-gradient(180deg, #1f1a14 0%, #14110e 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .back-link {
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .back-link:hover { background: rgba(201, 162, 85, 0.12); }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 24px;
      background: #171410;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--gold-dim); }
    .tab-btn.active {
      background: rgba(201, 162, 85, 0.18);
      color: var(--gold);
      border-color: var(--gold);
      font-weight: bold;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .class-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .class-header h2 {
      margin: 0 0 6px 0;
      color: var(--gold);
      font-size: 1.7rem;
    }
    .class-header .en-sub {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-box h3 {
      margin: 0 0 8px 0;
      color: var(--gold);
      font-size: 1.05rem;
      border-bottom: 1px solid rgba(61, 51, 38, 0.6);
      padding-bottom: 6px;
    }
    .en-note {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }
    .levels-list {
      display: grid;
      gap: 12px;
      margin-bottom: 28px;
    }
    .level-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .level-row strong { color: var(--gold); }
    .gallery-title {
      color: var(--gold);
      font-size: 1.2rem;
      margin: 24px 0 12px 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .gallery-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .gallery-item:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 8px;
      border: 1px solid var(--gold-dim);
    }
  </style>
</head>

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    function render(id) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
      const c = CLASSES.find(x => x.id === id) || CLASSES[0];
      const imgs = (window.CHARACTER_IMAGES && window.CHARACTER_IMAGES[c.id]) || [];

      contentEl.innerHTML = `
        <div class="class-header">
          <h2>${c.name}</h2>
          <div class="en-sub">${c.en}</div>
        </div>
        <div class="info-grid">
          <div class="card-box">
            <h3>特殊能力 (Special Abilities)</h3>
            <div>${c.special.replace(/\n/g, "<br>")}</div>
          </div>
          <div class="card-box">
            <h3>可裝備與定位 (Equipment &amp; Role)</h3>
            <div><strong>裝備：</strong>${c.equip}</div>
            <div style="margin-top:8px;">${c.bg}</div>
          </div>
        </div>
        ${c.levels.length ? `
          <div class="levels-list">
            ${c.levels.map(([lv, desc]) => `<div class="level-row"><strong>${lv}：</strong>${desc}</div>`).join("")}
          </div>
        ` : ""}
        <h3 class="gallery-title">角色與行動卡圖鑑（點擊圖片可放大，共 ${imgs.length} 張）</h3>
        <div class="gallery">
          ${imgs.map(src => `
            <div class="gallery-item" onclick="openLightbox('${src}')">
              <img src="${src}" loading="lazy" alt="${c.name}" />
            </div>
          `).join("")}
        </div>
      `;
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("open");
    }

    CLASSES.forEach((c, idx) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (idx === 1 ? " active" : "");
      btn.dataset.id = c.id;
      btn.textContent = c.name;
      btn.onclick = () => render(c.id);
      tabsEl.appendChild(btn);
    });

    render("01_Warden");
