<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oathsworn 角色行動卡圖鑑</title>
  <style>
    :root {
      --bg: #12100e;
      --panel: #1c1814;
      --panel-2: #241f1a;
      --border: #3d3326;
      --gold: #c9a255;
      --gold-dim: #8c703b;
      --text: #e6dcc8;
      --muted: #a69880;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    header {
      background: linear-gradient(180deg, #1f1a14 0%, #14110e 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .back-link {
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .back-link:hover { background: rgba(201, 162, 85, 0.12); }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 24px;
      background: #171410;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--gold-dim); }
    .tab-btn.active {
      background: rgba(201, 162, 85, 0.18);
      color: var(--gold);
      border-color: var(--gold);
      font-weight: bold;
    }
    .edition-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .edition-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .edition-btn.active {
      background: var(--gold);
      color: #14110e;
      border-color: var(--gold);
      font-weight: bold;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .class-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .class-header h2 {
      margin: 0 0 6px 0;
      color: var(--gold);
      font-size: 1.7rem;
    }
    .class-header .en-sub {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-box h3 {
      margin: 0 0 8px 0;
      color: var(--gold);
      font-size: 1.05rem;
      border-bottom: 1px solid rgba(61, 51, 38, 0.6);
      padding-bottom: 6px;
    }
    .en-note {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }
    .levels-list {
      display: grid;
      gap: 12px;
      margin-bottom: 28px;
    }
    .level-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .level-row strong { color: var(--gold); }
    .gallery-title {
      color: var(--gold);
      font-size: 1.2rem;
      margin: 24px 0 12px 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .gallery-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .gallery-item:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 8px;
      border: 1px solid var(--gold-dim);
    }
  </style>
</head>

    <h1>Oathsworn 角色行動卡圖鑑</h1>

  <script>
    const CLASSES = [
      {
        id: "00_Intro",
        name: "戰鬥流轉機制",
        en: "Game Mechanic - Battle Flow",
        equip: "武器列表：斧、劍、戰錘/釘頭錘、戟、長柄武器、長矛、匕首、盾牌、連枷、法杖、弓",
        special: "手牌與冷卻：每次遭遇戰前從已解鎖牌池構築 7 張手牌（0費×1、1費×2、2費×2、3費×2）。打出能力牌後置於玩家圖板對應數字（0–3）邊緣，並將該處原有卡牌向 0 推進 1 格（無連鎖）。回到 0 即可於重置階段或透過其他流轉效果回手。",
        bg: "左上角橘色數字為靈氣（Animus）消耗；底部藍色盾牌為防禦值。「守誓者（Oathsworn）」指所有完整角色與同伴；盟友與召喚物僅視為友方角色。",
        levels: []
      },
      {
        id: "01_Warden",
        name: "1. 典獄長",
        en: "The Warden",
        equip: "所有護甲、盾牌；除匕首、法杖與弓以外的所有單手與雙手武器。",
        special: "紀律（Discipline）：每輪一次，使一張卡牌流轉 1 次。\n鐵衣斗篷（The Mantle）：可使自己及任意數量相鄰角色免疫隊伍中巫者（Witch）的任何能力。",
        bg: "巫者的夢魘、異端審判所的左膀右臂。身穿黑鐵斗篷無效化魔法，以鎖鏈套住巫者並拖拽敵人。重甲坦克與戰場控制者，亦能持雙手武器輸出。",
        levels: [
          [
            "Lv 1 初始牌",
            "<b>0 費基礎牌</b>：每個職業都有這張必帶的 0 冷卻牌，具有多重重要功能。最基本的是讓玩家每回合都能進行一次高性價比攻擊；更常見的用法是在遭遇戰階段前影響戰鬥流轉並把牌拿回手牌。「重置力量牌庫（Refresh might decks）」能力則讓你在好牌都被抽光、牌庫對你不利時重置牌庫以提高勝算。<br><br><b>1 費（守護 Guard ／ 奪地 Claimed Ground）</b>：我們希望《Oathsworn》中的所有定位都真正綁定在主動機制而非單純數值上——當坦克不只是「+2 防禦」，而是衝過戰場擋在敵人的攻擊路線上。這正是從一開始就能在「守護」與「奪地」看到的設計。兩張都是低冷卻、最適合貼近敵人使用的能力，但理由截然不同：「奪地」只要站位正確就是強力的清怪技，最適合站在來襲敵群的路徑上挑釁牠們來搶地盤；「守護」則是救命神技，激勵你時刻留意隊友與自己的相對位置，一旦隊友即將陷入麻煩，就能免費拉近距離並以板甲與盾牌保護他們。<br><br><b>2 費（鎖鏈拖拽 Chain Drag ／ 弧形斬 Arcing Strike）</b>：2 冷卻帶來更多傷害與功能性。「鎖鏈拖拽」已證明極為萬用，能把敵人拉回自由團射程內、拖進障礙物甚至撞向其他敵人來削減血量。「弧形斬」則是另一張多目標能力，能對敵群傾瀉更多傷害，而且它會產出「奪地」所需的防禦指示物來觸發額外效果，兩者完美搭配讓你成為極強的清怪手。<br><br><b>3 費（盾擊 Shield Bash ／ 嘲諷 Taunt）</b>：3 冷卻賦予你更多功能性與坦度。典獄長是全能型職業，不一定要拿盾牌才能發揮——他擁有全遊戲最廣泛的武器選擇之一，只要搭對卡牌組合就能充分運用。無論走哪種流派，「盾擊」都是紮實的選擇：穩定的擊退極為實用，特別是附加在能受惠於道具（如戰錘）進一步增加擊退距離的攻擊上；擊退 3 非常優秀，因為大型怪物擊退距離減半（無條件進位），能推 2 格而非 1 格往往就足以讓牠撞上某個痛死人的東西。初始陣容的最後一張是經典坦技「嘲諷」，抓準時機使用常能救下自由團其餘成員免於恐怖的黑光浪潮或狂暴衝鋒，是確保隊友不被擊倒昏迷的最佳手段之一，緊急時還附帶低費攻擊選項。"
          ],
          [
            "Lv 2 解鎖",
            "2 級時典獄長學會開始對朋友大吼，而不只是對敵人。解鎖兩張能力，一張偏進攻、一張偏防禦：<b>「萬眾一心！（As One!）」</b>需要一點站位配合，但一旦成功就能提供全遊戲罕見的團隊戰鬥流轉控制；<b>「堅守陣地！（Stand Fast!）」</b>除了給隊友不錯的增益外，或許更重要的是它以極低消耗來流轉 2 費冷卻區——當與你的「紀律（Discipline）」等其他流轉來源結合時，甚至能讓大牌在打出的同一回合就回到手中，大幅強化你的防禦與戰術選擇。"
          ],
          [
            "Lv 5 解鎖",
            "該讓敵人嚐嚐苦頭了！5 級開啟相當可觀的單體傷害。可想而知，十噸重的血肉與骨頭在撕裂利爪背後揮下，輸出輕易就能超過多數自由團成員。<b>「反射（Reflection）」</b>讓你接下那份傷害並直接反彈回敵人身上——你還是會承受痛楚，但絕對值得！身為典獄長，你深知何時該落下致命一擊，而<b>「最終裁決（Final Verdict）」</b>正是讓你把握那個時機、懲罰敵人先前所受的傷勢（只是別等太久，免得對該部位傷害溢出而浪費了那些免費傷害）。"
          ],
          [
            "Lv 10 解鎖",
            "10 級再度甩出鎖鏈，這次是為了協助他人。只花 1 點靈氣就能移動 3 格並降低敵人防禦的<b>「鎖鏈束縛（Chained）」</b>極為超值，抓準時機使用也能發揮類似「堅守陣地！」的流轉紅利。<b>「干預（Intervention）」</b>則是另一張重磅機制牌，讓你把壞局翻轉為契機：不同於低冷卻的「守護」，這項能力讓你親自替目標承受攻擊，並將你與目標雙雙移動到新位置；搭配「嘲諷」與「守護」，你能以極為精細的微操掌控全隊承受的傷害。"
          ],
          [
            "Lv 15 解鎖",
            "無論你正揮舞巨型雙手武器還是持劍配盾，15 級的兩項解鎖在特定條件下都能發揮極致威力。<b>「守住防線！（Hold the Line!）」</b>可能是全遊戲最強的防禦能力——在《Oathsworn》裡全滅的方式多不勝數，因此能同時保護你與周圍所有人的能力簡直是天降恩賜；如同其他預測型能力，這張牌乍看像在賭運氣，但隨著你摸透數字背後的機率與訣竅，它其實是經過深思熟慮的戰術抉擇。<b>「尋心者（Heart Seeker）」</b>再次發揮典獄長瓦解敵人防禦的專長——由於防禦的除法效應，任何減防都會帶來巨大差異，只要確保站位排線正確即可；這也體現了遊戲的戰術深度：為了創造完美條件，你可能得付出靈氣、流轉、傷害或防禦等代價，而在權衡之間正藏著無數精妙的抉擇。"
          ]
        ]
      },
      {
        id: "02_Ursus",
        name: "2. 戰熊",
        en: "The Ursus Warbear",
        equip: "所有護甲；除匕首、法杖與弓以外的所有單手與雙手武器。",
        special: "頂級掠食者（Apex Predator）：每次遭遇戰開始時獲得兩枚 2x 強化指示物。\n耐力（Endurance）：厚實毛皮與龐大體型使能力牌提供比一般職業更高的防禦值。",
        bg: "沉默的八呎遊牧獵魔者，偏好肢體語言與「敲擊語」。坦克／輸出混合型；靈氣上限高（9）但 1 級回復僅 5，需妥善規劃。",
        levels: [
          [
            "Lv 1 初始牌",
            "<b>0 費基礎牌</b>：每個職業都有這張必帶的 0 冷卻牌，具有多重重要功能。最基本的是讓玩家每回合都能進行一次高性價比攻擊；更常見的用法是在遭遇戰階段前影響戰鬥流轉並把牌拿回手牌。「重置力量牌庫（Refresh might decks）」能力則讓你在好牌都被抽光、牌庫對你不利時重置牌庫以提高勝算。<br><br><b>1 費（野性咆哮 Feral Roar ／ 橫掃 Swipe）</b>：1 冷卻讓戰熊展現她的本色。「野性咆哮」是極佳的開戰技：你可以花 3 靈氣讓自己移動 4 格追捕獵物並順便帶一名隊友同行，或是把愛分享出去，讓另外 2 名隊友跟著她一起移動並投入戰鬥。若你需要傷害勝過移動，也可改為鼓舞自己與隊友獲得強化 x3 指示物，將力量牌升級打出巨額傷害。一旦貼身肉搏，「橫掃」就是收割敵群的利器——它打得極痛，而且讓戰熊比其他職業更早取得順劈攻擊（其他職業通常 2 費才有這種效果）。命中 3 名敵人就能獲得 +3 傷害，很可能讓每個敵人一口氣掉 2 血以上，在議會戰或大型怪物戰中極為實用。<br><br><b>2 費（鐵皮 Ironhide ／ 投擲 Toss）</b>：戰熊的 2 冷卻牌展現了她混合型定位的兩面。「鐵皮」看似簡單，只給你 1 枚防禦指示物留待後用或移動 2 格，但在她的流轉引擎中舉足輕重——擁有一張只需 1 靈氣就能推動 2 費區流轉的卡牌，代表你的 3 費大牌能比平常快得多回到手中（因為 2 費區傳統上塞滿高靈氣大招，不易頻繁打出）。「投擲」正是那種大招的典範：讓你痛扁一名敵人，將牠抓起來砸向另一名敵人，再讓後者踉蹌撞倒第三名，結果就是死傷一片外加盔甲上的又一道戰績刻痕；只要站位正確，這在雜魚／議會戰中是清場神技。<br><br><b>3 費（撕咬 Bite ／ 挑戰 Challenge）</b>：戰熊字面意義上「武裝到牙齒」，而且有兩種用法：需要時可當作低費攻擊，但若等到最佳時機，就能在敵人即將攻擊她或其他友方角色時咬上去打斷攻勢、大幅降低傷害（高階玩法往往就是靠這類打斷技在怪物利爪與血肉間築起多層防線）。「挑戰」則是戰熊真正扛起坦克之名的技能——支援盟友是一回事，刻意替他們硬吃下一擊則是另一回事，正是「挑戰」這類卡牌救下隊友性命、讓所有人站到最後。"

          [

          ],
          [
            "Lv 5 解鎖",
            "既然你已經扔過、掃過也撞飛過敵人，現在該讓牠們流血並把東西推倒砸在牠們身上了。<b>「撕裂（Rend）」</b>採用重複使用才發威的嵌套機制：用一次只是普通攻擊，但從第二次起流血就會造成沉重代價。把效果直接嵌套在牌面上，是我們為了幫玩家省去額外追蹤負擔的設計（全寫在牌上，不必記得在階段末或回合末結算）；若搭配隊伍裡其他有流血技的守誓者組成「流血隊」，更是強大。而<b>「推倒（Topple）」</b>則是純粹的爽快體驗——衝向一棵大樹並把它推倒砸向怪物！沒有其他職業能完成這種壯舉，只有無畏的戰熊敢嘗試（條件也確實嚴苛）；不過只要算準時機並帶幾張重抽，你就能以極低靈氣消耗打出全遊戲數一數二的最高傷害。"
          ],

          [
            "Lv 10 解鎖",
            "10 級解鎖兩張弓與刃的專屬技，以及巨鷹能力<b>「啄眼（Eye Gouge）」</b>。<b>「突刺（Lunge）」</b>是近戰女獵手的雙重攻擊，擅長刺穿大型目標；<b>「穿透箭（Piercing Arrow）」</b>則是弓箭版，能把敵人串成一線同時擊殺多個目標。<b>「啄眼」</b>看似不起眼，-1 防禦似乎不多，但考量到遊戲中傷害是除以防禦計算，0 靈氣就能帶來巨大提升（例如 10 傷打 4 防原本掉 2 血，降成 3 防後變成掉 3 血——0 靈氣換來 50% 傷害提升外加一次戰鬥流轉！），在疊滿增益的關鍵大招前使用更是神技。"
          ],
          [
            "Lv 15 解鎖",
            "終於來到 15 級的三張 3 費重砲：<b>「獵鷹連擊（Falcon Strike）」</b>是強大的連鎖攻擊，時機對了最多可一口氣放倒 6 名敵人；<b>「雙重打擊（Tandem Strike）」</b>附帶 2 次重抽與召回，將箭術推向極限（2 次重抽可讓你從抽 5 張推到抽 10 張，最適合疊滿強化後打高血量目標）；最後是<b>「死亡俯衝（Death Dive）」</b>，讓雙鷹同時撲向單一目標，利爪齊出合擊成 8 張牌且絕不會失手的攻擊，讓敵人最後看到的畫面是頭頂遮蔽陽光的雙子彗星。"
          ]
        ]
      }
    ];

    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    let currentClassId = "01_Warden";
    let currentEdition = "v1";

    function switchEdition(ed) {
      currentEdition = ed;
      render(currentClassId);
    }

    function render(id) {
      currentClassId = id;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
      const c = CLASSES.find(x => x.id === id) || CLASSES[0];
      const imgs = (window.CHARACTER_IMAGES && window.CHARACTER_IMAGES[c.id]) || [];
      let headerImgs = imgs, levelBuckets = [];
      if (c.levels.length === 5) {
        if (c.id === "03_Witch") {
          headerImgs = imgs.slice(0, imgs.length - 13);
          const rest = imgs.slice(imgs.length - 13);
          levelBuckets = [rest.slice(0, 6), rest.slice(6, 8), rest.slice(8, 9), rest.slice(9, 11), rest.slice(11, 13)];
        } else if (c.id === "12_Huntress") {
          headerImgs = imgs.slice(0, 4);
          const rest = imgs.slice(4);
          levelBuckets = [rest.slice(0, 4), rest.slice(4, 6), rest.slice(6, 8), rest.slice(8, 10), rest.slice(10, 12)];
        } else {
          const lv1End = Math.max(0, imgs.length - 4);
          const lv1Start = Math.max(0, lv1End - 4);
          headerImgs = imgs.slice(0, lv1Start);
          levelBuckets = [
            imgs.slice(lv1Start, lv1End),
            imgs.slice(lv1End, lv1End + 1),
            imgs.slice(lv1End + 1, lv1End + 2),
            imgs.slice(lv1End + 2, lv1End + 3),
            imgs.slice(lv1End + 3, lv1End + 4)
          ];
        }
      }

      const v2 = window.CHARACTER_V2 && window.CHARACTER_V2[c.id];
      const v2Count = v2 && v2.sections ? v2.sections.reduce((a, s) => a + (s.imgs ? s.imgs.length : 0), 0) : 0;
      const editionTabsHtml = `
        <div class="edition-tabs">
          <button class="edition-btn ${currentEdition === "v1" ? "active" : ""}" onclick="switchEdition('v1')">舊版（1st Edition）</button>
          <button class="edition-btn ${currentEdition === "v2" ? "active" : ""}" onclick="switchEdition('v2')">新版（2nd Edition 修正版${v2Count ? ` · ${v2Count} 張` : ""}）</button>
        </div>
      `;

      if (currentEdition === "v2" && v2) {
        contentEl.innerHTML = `
          ${editionTabsHtml}
          <div class="class-header">
            <h2>${c.name} — 2 版修正與新增</h2>
            <div class="en-sub">${c.en} (2nd Edition Upgrade Pack)</div>
          </div>
          <div class="card-box" style="margin-bottom:20px;">
            <h3>2 版改動總覽</h3>
            <div>${v2.summary}</div>
          </div>
          <div class="levels-list">
            ${v2.sections.map(sec => `
              <div class="level-row">
                <div style="margin-bottom:${sec.imgs && sec.imgs.length ? "12px" : "0"};">
                  <strong>${sec.title}</strong>
                  <div style="margin-top:6px;">${sec.desc}</div>
                </div>
                ${sec.imgs && sec.imgs.length ? `
                  <div class="gallery">
                    ${sec.imgs.map(src => `
                      <div class="gallery-item" onclick="openLightbox('${src}')">
                        <img src="${src}" loading="lazy" alt="${sec.title}" />
                      </div>
                    `).join("")}
                  </div>
                ` : ""}
              </div>
            `).join("")}
          </div>
        `;
        return;
      }

      contentEl.innerHTML = `
        ${editionTabsHtml}
        <div class="class-header">
          <h2>${c.name}</h2>
          <div class="en-sub">${c.en}</div>
        </div>
        ${headerImgs.length ? `
          <div class="gallery" style="margin-bottom:20px;">
            ${headerImgs.map(src => `
              <div class="gallery-item" onclick="openLightbox('${src}')">
                <img src="${src}" loading="lazy" alt="${c.name}" />
              </div>
            `).join("")}
          </div>
        ` : ""}
        <div class="info-grid">
          <div class="card-box">
            <h3>特殊能力 (Special Abilities)</h3>
            <div>${c.special.replace(/\n/g, "<br>")}</div>
          </div>
          <div class="card-box">
            <h3>可裝備與定位 (Equipment &amp; Role)</h3>
            <div><strong>裝備：</strong>${c.equip}</div>
            <div style="margin-top:8px;">${c.bg}</div>
          </div>
        </div>
        ${(window.CHARACTER_LORE && window.CHARACTER_LORE[c.id]) ? `
          <details style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:24px;">
            <summary style="cursor:pointer;color:var(--gold);font-weight:bold;user-select:none;">📖 展開完整背景故事與玩法詳解 (Background &amp; Lore)</summary>
            <div style="margin-top:12px;white-space:pre-line;color:var(--text);font-size:0.96rem;line-height:1.75;">${window.CHARACTER_LORE[c.id]}</div>
          </details>
        ` : ""}
        ${c.levels.length ? `
          <div class="levels-list">
            ${c.levels.map(([lv, desc], i) => {
              const slice = levelBuckets[i] || [];
              return `
                <div class="level-row">
                  <div style="margin-bottom:${slice.length ? "12px" : "0"};"><strong>${lv}：</strong>${desc}</div>
                  ${slice.length ? `
                    <div class="gallery">
                      ${slice.map(src => `
                        <div class="gallery-item" onclick="openLightbox('${src}')">
                          <img src="${src}" loading="lazy" alt="${lv}" />
                        </div>
                      `).join("")}
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>
        ` : ""}
      `;
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("open");
    }

    CLASSES.forEach((c, idx) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (idx === 1 ? " active" : "");
      btn.dataset.id = c.id;
      btn.textContent = c.name;
      btn.onclick = () => render(c.id);
      tabsEl.appendChild(btn);
    });

    render("01_Warden");
  </script>
</body>
</html>
